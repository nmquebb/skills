# yaml-language-server: $schema=https://raw.githubusercontent.com/nmquebb/skills/v1/skills/q-workflow/references/config.schema.json
#
# q skill suite: project configuration. Contract: q-workflow references/config.md.
# Every key except `version` is optional; an omitted key uses the detected value or default.
version: 1

tracker:
  backend: github                 # github | local | custom
  # repo: owner/name              # github; default: the git remote's repository
  # dir: docs/issues              # local
  # adapter: .agents/q/tracker.md # custom: project adapter document
  # labels:                       # github: label per status
  #   proposed: "triage: proposed"
  #   questions: "triage: questions"
  #   ready: "ready for implementation"
  #   inProgress: "in progress"
  #   inReview: "in review"
  #   blocked: "blocked"

integration:
  host: github                    # github: one ready pull request | local: merge in the control checkout
  # mergeMethod: merge            # merge | squash | rebase
  # push: false                   # local: push the parent after committing to it

git:
  # remote: origin                # "none" for a repository without a remote
  parentBranch: main
  # workspace: worktree           # worktree | branch
  # worktreeRoot: ~/.q/worktrees/{repo}

# branches:
#   lifecycle: "{type}/{slug}"
#   issue: "{type}/GH-{id}-{slug}"  # local default: "{type}/issue-{id}-{slug}"

# paths:
#   work: docs/work-in-progress
#   deliveries: docs/deliveries
#   decisions: docs/decisions
#   threatModel: docs/threat-model.md
#   feedback: docs/workflow/pending-feedback.md

roadmap:
  backend: none                   # none | local | github-project
  # file: docs/roadmap.md         # local
  # owner: your-org               # github-project
  # number: 1                     # github-project

# conventions:                    # project guidance; outranks the suite baselines
#   codeStyle: [docs/conventions/code-style.md]
#   testing: [docs/conventions/testing.md]
#   architecture: [docs/architecture/overview.md]
#   baseline: true                # also apply q-code-quality's baseline where project guidance is silent

# commands:                       # discovered from AGENTS.md, package scripts, Makefile, CI when omitted
#   install: npm ci
#   format: npm run format
#   formatCheck: npm run format:check
#   lint: npm run lint
#   typecheck: npm run typecheck
#   test: npm test
#   build: npm run build

# risk:
#   boundaries: []                # extra manual-risk boundaries, added to the defaults

# checks:                         # questions every delivery answers
#   - ask: Does this change collected personal data, processors, or retention?
#     ifYes: Update the privacy policy page and its "Last updated" date in the same delivery.

# agents:
#   launcher: native              # native | paseo
#   routes:                       # role: "<model> [effort] [mode]"; see references/orchestration.md
#     finalReviewer: opus

# archive:
#   trigger: after-merge          # after-merge | automation
#   publish: direct               # github: direct | pull-request; local: local
